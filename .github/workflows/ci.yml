name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows blocks like the others since v0.2.3 (it passed with 0.2.1/0.2.2 bar one test bug).
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # The extension's logic is tested by running it in node. Without node those tests
      # SKIP, and a green run would hide that they never ran, so node is installed here
      # and any node skip fails the build.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check capsule tests
      - name: Test
        shell: bash
        run: |
          uv run pytest -q -rs | tee pytest.out
          ! grep -q "node is not installed" pytest.out

  # The evaluator's path, end to end, on fresh machines: run the one-line installer (from this
  # checkout rather than a downloaded release), then check the running backend the way the
  # extension would. Catches what unit tests cannot: a missing dependency, a broken script, a
  # backend that does not start.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          CAPSULE_INSTALL_SOURCE: ${{ github.workspace }}
          CAPSULE_HOME: ${{ runner.temp }}/capsule
          CAPSULE_AUTOSTART: "0"
          # The runner has a Python 3.12 that a user's computer usually lacks: make uv download
          # its own, as it must for a user, and the smoke check prove that it did.
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          sh install.sh
          bash scripts/ci-install-smoke.sh
      # Install and check in ONE step: on Windows the runner ends a step's background
      # processes when the step finishes, so the server install.ps1 started would be gone.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CAPSULE_INSTALL_SOURCE: ${{ github.workspace }}
          # A space in the path, as in most Windows profile folders (Codex review).
          CAPSULE_HOME: ${{ runner.temp }}\Capsule Test
          CAPSULE_AUTOSTART: "0"
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Git's bash by full path: a bare `bash` can resolve to WSL's.
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci-install-smoke.sh
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The real user path on Windows, which CI never ran before v0.2.1 failed on it: install
      # again (an upgrade over the step above) WITH the logon task. The task runs Capsule
      # independently of this step, so the check can follow in the same step or later.
      - name: Upgrade with the logon task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CAPSULE_INSTALL_SOURCE: ${{ github.workspace }}
          CAPSULE_HOME: ${{ runner.temp }}\Capsule Test
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ScheduledTask -TaskName 'Capsule Backend' | Format-List TaskName,State
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci-install-smoke.sh
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Server logs (on failure)
        if: failure()
        shell: bash
        env:
          CAPSULE_HOME: ${{ runner.os == 'Windows' && format('{0}\Capsule Test', runner.temp) || format('{0}/capsule', runner.temp) }}
        run: |
          for f in "$CAPSULE_HOME"/logs/*; do echo "== $f"; tail -50 "$f"; done || true
