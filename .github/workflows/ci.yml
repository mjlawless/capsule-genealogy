name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is new to CI with v0.1.0; report it, but do not block on it yet.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # The extension's logic is tested by running it in node. Without node those tests
      # SKIP, and a green run would hide that they never ran, so node is installed here
      # and any node skip fails the build.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check capsule tests
      - name: Test
        shell: bash
        run: |
          uv run pytest -q -rs | tee pytest.out
          ! grep -q "node is not installed" pytest.out

  # The evaluator's path, end to end, on fresh machines: run the one-line installer (from this
  # checkout rather than a downloaded release), then check the running backend the way the
  # extension would. Catches what unit tests cannot: a missing dependency, a broken script, a
  # backend that does not start.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          CAPSULE_INSTALL_SOURCE: ${{ github.workspace }}
          CAPSULE_HOME: ${{ runner.temp }}/capsule
          CAPSULE_AUTOSTART: "0"
        run: sh install.sh
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CAPSULE_INSTALL_SOURCE: ${{ github.workspace }}
          # A space in the path, as in most Windows profile folders (Codex review).
          CAPSULE_HOME: ${{ runner.temp }}\Capsule Test
          CAPSULE_AUTOSTART: "0"
        run: ./install.ps1
      - name: The installed backend works without an API key
        shell: bash
        env:
          CAPSULE_HOME: ${{ runner.os == 'Windows' && format('{0}\Capsule Test', runner.temp) || format('{0}/capsule', runner.temp) }}
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8765/health
          # A web page cannot pair (only Capsule's own extension ID can).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://127.0.0.1:8765/pair)
          test "$code" = 403
          # A capture with no key is archived, with its extraction pending.
          cd "$CAPSULE_HOME"
          token_file=$(uv run --project "$CAPSULE_HOME/app" python -c "from capsule.config import token_path; print(token_path())")
          token=$(tr -d '\r\n' < "$token_file")
          curl -fsS -X POST http://127.0.0.1:8765/capture \
            -H "Content-Type: application/json" -H "X-Capsule-Token: $token" \
            -d '{"url":"https://example.org/record/1","html":"<html><body><p>Name: John Doe</p></body></html>"}' \
            | tee capture.json
          grep -q '"extraction_pending":true' capture.json
