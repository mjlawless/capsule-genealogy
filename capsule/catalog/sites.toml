# The sites Genealogy Capsule is known to work with: the source of truth for SITES.md and
# the README table. After editing, run `uv run python -m capsule.catalog` to regenerate
# them; a test fails while they are out of date.
#
# level:
#   tested  - used on real research, with verified captures of the pages named in `pages`
#   special - Capsule has code for this site, but it has not been tested live yet
#   generic - no site-specific code; the ordinary page capture should work, not yet tested
# access: free | free-registration | subscription
# arm_download: the extension has a download profile for the site (download-intercept.js)
#
# Public file: never put record URLs, record ids or capture counts here.

[[site]]
id = "ancestry"
arm_download = true
name = "Ancestry"
url = "https://www.ancestry.com/"
hosts = ["ancestry.com", "ancestry.co.uk", "ancestry.ca", "ancestry.com.au", "ancestry.de", "ancestry.fr", "ancestry.it", "ancestry.se", "ancestry.mx"]
access = "subscription"
level = "tested"
pages = "Record pages, and record images through Ancestry's own Download button"
handling = ["record id read from the address, so a record is never captured twice", "household members read from the record", "accepts the image download from Ancestry's image server"]
limits = "For the image, arm the capture, then use the site's Download button."

